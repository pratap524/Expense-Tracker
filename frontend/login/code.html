<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-fixed-variant": "#384775",
                        "tertiary-dim": "#d8bceb",
                        "surface-dim": "#0d0e12",
                        "on-surface": "#e4e4f0",
                        "surface": "#0d0e12",
                        "background": "#0d0e12",
                        "on-tertiary": "#5f4971",
                        "on-secondary-container": "#babed5",
                        "on-tertiary-fixed": "#422d53",
                        "error": "#fa746f",
                        "secondary-dim": "#b3b8cf",
                        "error-container": "#871f21",
                        "surface-container": "#181920",
                        "secondary-fixed-dim": "#cfd3eb",
                        "secondary-fixed": "#dde1f9",
                        "on-secondary-fixed": "#393f51",
                        "tertiary-fixed-dim": "#d8bceb",
                        "inverse-primary": "#4e5d8c",
                        "inverse-surface": "#faf8fe",
                        "surface-container-high": "#1e1f26",
                        "on-secondary": "#3a4052",
                        "primary-container": "#42517f",
                        "on-tertiary-container": "#564067",
                        "error-dim": "#c54d4a",
                        "surface-container-lowest": "#000000",
                        "surface-bright": "#2a2c34",
                        "primary-dim": "#a8b7ec",
                        "on-surface-variant": "#aaaab5",
                        "tertiary-container": "#e6cafa",
                        "primary-fixed": "#b6c5fb",
                        "on-error-container": "#ff9993",
                        "inverse-on-surface": "#54555a",
                        "tertiary": "#f1daff",
                        "outline": "#74757f",
                        "on-background": "#e4e4f0",
                        "outline-variant": "#464750",
                        "on-primary-container": "#dce2ff",
                        "surface-variant": "#23252e",
                        "primary": "#b6c5fb",
                        "on-primary": "#2f3e6b",
                        "secondary": "#c1c5dd",
                        "on-secondary-fixed-variant": "#565b6f",
                        "secondary-container": "#363b4d",
                        "surface-tint": "#b6c5fb",
                        "primary-fixed-dim": "#a8b7ec",
                        "surface-container-highest": "#23252e",
                        "on-tertiary-fixed-variant": "#604a71",
                        "surface-container-low": "#121318",
                        "tertiary-fixed": "#e6cafa",
                        "on-primary-fixed": "#1a2a56",
                        "on-error": "#490006"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "fontFamily": {
                        "headline": ["Manrope"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            background: rgba(24, 25, 32, 0.7);
            backdrop-filter: blur(40px);
        }
        .editorial-gradient {
            background: linear-gradient(135deg, #b6c5fb 0%, #6978a9 100%);
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body selection:bg-primary/30 antialiased overflow-hidden">
<div class="relative min-h-screen flex items-center justify-center px-6 py-12">
<!-- Background Architectural Elements -->
<div class="absolute inset-0 z-0 overflow-hidden">
<div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] rounded-full bg-primary/5 blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] rounded-full bg-tertiary/5 blur-[120px]"></div>
<!-- High-quality architectural background image with tonal overlay -->
<div class="absolute inset-0 opacity-20 mix-blend-overlay">
<img alt="Architectural skyscraper detail" class="w-full h-full object-cover" data-alt="Abstract architectural lines of a glass skyscraper reflected in dusk light with deep blue and purple tones" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA48QYAS8tMiV2OzMwBUCVv_aK8pVacsNGqsvygBgyn7a9WjQng5iKgDlmVfDujUphsXgeqtGkprCVS4O1dfh1Yb6cKxn677incNxdlRsOcSYMSjr8-ZX6ohOeWOW5wCfS20Eferbxtj2munJJHb0mUv8twoNag7Y5nwVCtN-JvdQBlnW6DPkPMtZfUUgvC9eWMO933Pz_F-FM4UlOvloRWUAZVpsF8DdW04RwuJCTEYbXS0EKXJ7BaZ05prB0MUpuFYi25_0pMhxc"/>
</div>
</div>
<!-- Login Card -->
<main class="relative z-10 w-full max-w-md">
<div class="glass-card p-10 xl:p-12 rounded-xl shadow-[0_40px_100px_rgba(0,0,0,0.4)] border border-outline-variant/10">
<!-- Logo & Brand -->
<div class="text-center mb-10">
<div class="inline-flex items-center justify-center p-3 mb-6 bg-surface-container-highest rounded-xl">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="account_balance">account_balance</span>
</div>
<h1 class="font-headline font-black text-3xl tracking-tight text-on-surface mb-2">Architect</h1>
<p class="font-label text-sm text-on-surface-variant font-medium uppercase tracking-widest">Wealth Management</p>
</div>
<!-- Form Section -->
<form class="space-y-6">
<div class="space-y-2">
<label class="block font-label text-xs font-semibold text-on-surface-variant ml-1" for="email">EMAIL ADDRESS</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-lg" data-icon="mail">mail</span>
</div>
<input class="block w-full pl-12 pr-4 py-4 bg-surface-container-high border-none rounded-xl text-on-surface placeholder:text-outline/50 focus:ring-2 focus:ring-primary/20 transition-all duration-300" id="email" name="email" placeholder="name@company.com" type="email"/>
</div>
</div>
<div class="space-y-2">
<div class="flex justify-between items-center ml-1">
<label class="block font-label text-xs font-semibold text-on-surface-variant" for="password">PASSWORD</label>
<a class="text-xs font-semibold text-primary hover:text-primary-fixed transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-lg" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-12 pr-12 py-4 bg-surface-container-high border-none rounded-xl text-on-surface placeholder:text-outline/50 focus:ring-2 focus:ring-primary/20 transition-all duration-300" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 pr-4 flex items-center text-on-surface-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-lg" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<div class="pt-2">
<button class="editorial-gradient w-full py-4 rounded-xl font-headline font-bold text-on-primary-fixed shadow-lg hover:shadow-primary/20 hover:scale-[1.01] active:scale-[0.99] transition-all duration-200" type="submit">
                            Sign In
                        </button>
</div>
</form>
<!-- Divider -->
<div class="relative my-10">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/10"></div>
</div>
<div class="relative flex justify-center text-xs uppercase tracking-tighter">
<span class="px-4 bg-surface-container text-on-surface-variant rounded-full">Or continue with</span>
</div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center space-x-2 py-3 px-4 bg-surface-container-highest border border-outline-variant/5 rounded-xl hover:bg-surface-bright transition-all duration-200">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="text-sm font-medium">Google</span>
</button>
<button class="flex items-center justify-center space-x-2 py-3 px-4 bg-surface-container-highest border border-outline-variant/5 rounded-xl hover:bg-surface-bright transition-all duration-200">
<svg class="w-5 h-5 fill-on-surface" viewbox="0 0 24 24">
<path d="M17.05 20.28c-.96.95-2.04 1.81-3.14 1.81-1.12 0-1.44-.65-2.71-.65-1.27 0-1.63.63-2.71.65-1.09.02-2.31-1.02-3.27-1.99C3.25 18.15 1.76 14.66 1.76 11.38c0-3.39 2.1-5.18 4.15-5.18 1.08 0 2.03.7 2.68.7.64 0 1.77-.82 3.01-.82 1.34 0 2.5.58 3.23 1.57-2.64 1.55-2.2 5.17.41 6.35-.91 2.31-2.01 4.54-3.19 6.28zM12.03 5.41c-.02-2.13 1.75-3.87 3.84-3.91.02 2.39-2.09 4.05-3.84 3.91z"></path>
</svg>
<span class="text-sm font-medium text-on-surface">Apple</span>
</button>
</div>
<!-- Footer Text -->
<div class="mt-10 text-center space-y-2">
<p class="text-sm text-on-surface-variant">
        Don't have an account? 
        <a class="font-bold text-primary hover:text-primary-fixed transition-colors" href="#">Start for free</a>
</p>
<p class="text-sm text-on-surface-variant">
        New to Architect? 
        <a class="font-bold text-primary hover:text-primary-fixed transition-colors" href="#">Register here</a>
</p>
</div>
</div>
<!-- Contextual Footer (Simplified for Login) -->
<div class="mt-8 flex justify-center space-x-6 text-xs font-label text-outline uppercase tracking-widest opacity-50">
<a class="hover:text-on-surface transition-colors" href="#">Privacy Policy</a>
<a class="hover:text-on-surface transition-colors" href="#">Terms of Service</a>
<a class="hover:text-on-surface transition-colors" href="#">System Status</a>
</div>
</main>
</div>
<!-- Decorative Bottom Gradient for Architectural Depth -->
<div class="fixed bottom-0 left-0 w-full h-32 bg-gradient-to-t from-background to-transparent pointer-events-none z-20"></div>
</body></html>
